<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Kelsey ❤️</title>
<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

/* Overlay */
#overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #0f0f1a;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    cursor: pointer;
    z-index: 10;
}

/* Text container */
.container {
    width: 90%;
    max-width: 600px;
    text-align: center;
}

#text {
    font-size: 30px;
    line-height: 1.7;
    min-height: 140px;
}

.cursor {
    display: inline-block;
    width: 3px;
    background: white;
    margin-left: 5px;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 50%, 100% {opacity: 1;}
    25%, 75% {opacity: 0;}
}

/* Floating emojis */
.emoji {
    position: absolute;
    font-size: 22px;
    animation: floatUp linear forwards;
}

@keyframes floatUp {
    from {
        transform: translateY(100vh);
        opacity: 1;
    }
    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div id="overlay" onclick="startExperience()">
    Tap to begin ❤️
</div>

<div class="container">
    <div id="text"></div><span class="cursor"></span>
</div>

<!-- 🎵 Background emotional beats -->
<audio id="bgMusic" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-slowmotion.mp3" type="audio/mpeg">
</audio>

<script>
const messages = [
    "Hey Kelsey…",
    "I just wanted to say something small… but important.",
    "You really need to stop underestimating yourself 😌",
    "Because from where I’m standing…",
    "You’re actually kind of incredible.",
    "Okay not kind of… VERY.",
    "Also… quick observation 😂",
    "If overthinking was a sport… you'd be undefeated 🥇",
    "But don’t worry…",
    "I’ll be here to remind you of reality.",
    "Reality = you’re amazing.",
    "You’re kind.",
    "You’re beautiful.",
    "You’re strong.",
    "And yes… a little stubborn 😏",
    "But that’s part of the charm.",
    "Even on your worst days…",
    "You’re still more than enough ❤️",
    "And just in case you forget…",
    "There’s someone here who sees you clearly…",
    "And still chooses you.",
    "Also random thought 😭",
    "If cuteness was illegal…",
    "You’d be serving life sentence.",
    "Anyway…",
    "I hope this made you smile 😊"
];

let i = 0;
let j = 0;
let current = "";
let musicStarted = false;

function startExperience() {
    document.getElementById("overlay").style.display = "none";

    const music = document.getElementById("bgMusic");
    music.volume = 0.0;
    music.play();

    // smooth fade-in 🎧
    let vol = 0;
    const fade = setInterval(() => {
        if (vol < 0.3) {
            vol += 0.02;
            music.volume = vol;
        } else {
            clearInterval(fade);
        }
    }, 200);

    typeEffect();
}

function typeEffect() {
    if (i < messages.length) {
        if (j < messages[i].length) {
            current += messages[i].charAt(j);
            document.getElementById("text").innerHTML = current;
            j++;
            setTimeout(typeEffect, 35);
        } else {
            setTimeout(() => {
                current = "";
                j = 0;
                i++;
                typeEffect();
            }, 1300);
        }
    }
}

/* Floating emojis */
function createEmoji() {
    const emojis = ["❤️","😂","✨","💕","🥰"];
    const emoji = document.createElement("div");
    emoji.classList.add("emoji");
    emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];

    emoji.style.left = Math.random() * 100 + "vw";
    emoji.style.animationDuration = (Math.random() * 3 + 3) + "s";

    document.body.appendChild(emoji);

    setTimeout(() => {
        emoji.remove();
    }, 6000);
}

setInterval(createEmoji, 900);
</script>

</body>
</html>
