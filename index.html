<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat with You ❤️</title>
<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0f0f1a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* App container */
.app {
    width: 320px;
    height: 600px;
    background: #1e1e2f;
    border-radius: 25px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

.header {
    background: #ff4d6d;
    padding: 15px;
    color: white;
    text-align: center;
    font-weight: bold;
}

.chat {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

.message {
    max-width: 75%;
    padding: 10px;
    margin: 5px;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.4;
    animation: fadeIn 0.4s ease;
}

.you {
    background: #ff4d6d;
    color: white;
    align-self: flex-end;
}

.her {
    background: #2c2c3e;
    color: white;
    align-self: flex-start;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="app">
    <div class="header">Kelsey ❤️</div>
    <div class="chat" id="chat"></div>
</div>

<script>
const chat = document.getElementById("chat");

const conversation = [
    {sender: "you", text: "Hey Kelsey…"},
    {sender: "her", text: "Hey..."},
    {sender: "you", text: "Important question"},
    {sender: "her", text: "Why does that sound serious 😂"},
    {sender: "you", text: "Because it is"},
    {sender: "you", text: "How are you this amazing and still acting like you’re not?"},
    {sender: "her", text: "Stoppp 😂"},
    {sender: "you", text: "No seriously, explain yourself"},
    
    {sender: "you", text: "Also… if overthinking was a sport, you’d have like 3 gold medals by now 🥇"},
    {sender: "her", text: "Wow 😭 rude"},
    {sender: "you", text: "Not rude. Just accurate. But don’t worry… I’m your coach now"},
    
    {sender: "you", text: "Rule number 1: You’re not allowed to be hard on yourself"},
    {sender: "her", text: "And if I break the rule?"},
    {sender: "you", text: "Penalty: I remind you how amazing you are 10 times"},
    
    {sender: "you", text: "Like right now"},
    {sender: "you", text: "You’re kind"},
    {sender: "you", text: "You’re beautiful"},
    {sender: "you", text: "You’re strong"},
    {sender: "you", text: "You’re special"},
    {sender: "you", text: "And slightly stubborn… but we’ll work on that 😂"},
    
    {sender: "her", text: "Excuse me?? 😂"},
    {sender: "you", text: "I said what I said"},
    
    {sender: "you", text: "But jokes aside…"},
    {sender: "you", text: "Even when you feel unsure"},
    {sender: "you", text: "You’re still more than enough ❤️"},
    
    {sender: "her", text: "That actually means a lot…"},
    {sender: "you", text: "Good. Because I’m not going anywhere"},
    
    {sender: "you", text: "So anytime your brain starts acting dramatic again…"},
    {sender: "you", text: "Just remember there’s someone here"},
    {sender: "you", text: "Who sees you clearly"},
    {sender: "you", text: "And still chooses you"},
    
    {sender: "you", text: "Also random thought…"},
    {sender: "her", text: "What now 😂"},
    {sender: "you", text: "If cuteness was illegal, you’d be serving life sentence"},
    
    {sender: "her", text: "You’re actually crazy 😂"},
    {sender: "you", text: "Crazy about you? yes."},
    
    {sender: "you", text: "Anyway… just wanted you to smile a little today 😊"}
];

let i = 0;

function addMessage(sender, text) {
    const msg = document.createElement("div");
    msg.classList.add("message", sender);
    msg.innerText = text;
    chat.appendChild(msg);

    chat.scrollTop = chat.scrollHeight;
}

function startChat() {
    if (i < conversation.length) {
        addMessage(conversation[i].sender, conversation[i].text);
        i++;
        setTimeout(startChat, 1400);
    }
}

startChat();
</script>

</body>
</html>
